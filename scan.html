<input id="qrData" placeholder="paste student's JsSON here">
<button onclick="sendStudent()">Send student scanned</button>
<p id="result"></p>

<script>
async function sendStudent() {
    const raw = document.getElementById("qrData").value;
    document.getElementById("qrData").value = ""; // clean qrData
    try {
        const student = JSON.parse(raw); //text to JSON

        // Chech keys and values
        const requiredKeys = ["student_id", "name"]; 
        if (!requiredKeys.every(k => student.hasOwnProperty(k))) {
            throw new Error("JSON incompleto");
        }

        const response = await fetch("/board_student", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(student)
        });

        const result = await response.json();
        document.getElementById("result").innerText = result.message;

        if (result.status === "ok") {
            const startBtn = window.opener?.document.getElementById("startBtn");
            if (startBtn) startBtn.disabled = false;
        }

    } catch (err) {
        document.getElementById("result").innerText = "❌ QR inválido: " + err.message;
    }
}
</script>
