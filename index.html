<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShuddle Tracker</title>
</head>
<body>
  <h1>MyShuddle Tracker</h1>
  <button id="startBtn">Start Trip</button>
  <button id="stopBtn" disabled>Stop Trip</button>

  <script>
    const backendLocationUrl = "https://126ac0d22d18.ngrok-free.app/location";
    const backendStartUrl = "https://126ac0d22d18.ngrok-free.app/start_trip";
    const backendStopUrl  = "https://126ac0d22d18.ngrok-free.app/stop_trip";

    let trackingInterval = null;

    // --- Start Trip ---
    document.getElementById("startBtn").addEventListener("click", async () => {
      try {
        const res = await fetch(backendStartUrl, { method: "POST" });
        const data = await res.json();
        if (data.status !== "ok") throw new Error(data.message);

        alert("Trip started!");
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;

        // Function to send coordinates
        const sendLocation = (pos) => {
          const locationData = {
            bus_id: "bus123",
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            timestamp: new Date().toISOString()
          };
          fetch(backendLocationUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(locationData)
          }).then(res => res.json())
            .then(r => console.log("Server response:", r))
            .catch(err => console.error("Error sending location:", err));
        };

        // Send initial location immediately
        navigator.geolocation.getCurrentPosition(sendLocation);

        // Send location every 30s
        trackingInterval = setInterval(() => {
          navigator.geolocation.getCurrentPosition(sendLocation);
        }, 30000);

      } catch (err) {
        alert("Error starting trip: " + err.message);
      }
    });

    // --- Stop Trip ---
    document.getElementById("stopBtn").addEventListener("click", async () => {
      try {
        const res = await fetch(backendStopUrl, { method: "POST" });
        const data = await res.json();
        if (data.status !== "ok") throw new Error(data.message);

        alert("Trip stopped!");
        clearInterval(trackingInterval);
        trackingInterval = null;

        document.getElementById("startBtn").disabled = false;
        document.getElementById("stopBtn").disabled = true;
      } catch (err) {
        alert("Error stopping trip: " + err.message);
      }
    });
  </script>
</body>
</html>
