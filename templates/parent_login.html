<!DOCTYPE html>
<html>
<head>
    <title>Parent Login - MyShuddle</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        .form { display: inline-block; padding: 20px; border: 1px solid #ccc; }
        input { width: 200px; padding: 8px; margin: 5px 0; }
        button { padding: 8px 16px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>🔒 Parent Access</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/parent/login" class="form">
        <p><input type="email" name="email" placeholder="Parent email" required></p>
        <p><input type="password" name="password" placeholder="Password" required></p>
        <p><button type="submit">Login</button></p>
    </form>
</body>
</html>
