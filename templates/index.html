<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShuddle Tracker</title>
</head>
<body>
    <h1>MyShuddle Tracker</h1>

    <button id="scanQRBtn">Scan Students QR</button>
    <button id="startBtn" disabled>Start Trip</button>
    <button id="stopBtn" disabled>Stop Trip</button>

    <h2>Estudiantes a bordo</h2>
    <div id="studentsList"></div>

    <script>
        const NGROK_URL = "{{ ngrok_url }}";
        const backendStartUrl = `${NGROK_URL}/start_trip`;
        const backendLocationUrl = `${NGROK_URL}/location`;
        const backendStopUrl = `${NGROK_URL}/stop_trip`;
        const backendBoardUrl = `${NGROK_URL}/board_student`;

        let scannedStudents = [];  
        let trackingInterval = null;
        let studentsStatusMap = {}; // guarda estado de cada estudiante

        // --- Función para actualizar la lista de estudiantes ---
        async function loadStudents() {
            const response = await fetch("/get_boarded_students");
            const studentsFromServer = await response.json();

            // Combinar estudiantes escaneados pre-viaje y los del servidor
            const allStudents = [...new Map(
                [...scannedStudents, ...studentsFromServer].map(s => [s.student_id, s])
            ).values()];

            // Actualizar el mapa de estado
            allStudents.forEach(s => {
                if (!studentsStatusMap[s.student_id]) {
                    studentsStatusMap[s.student_id] = s.status || "onboard";
                } else {
                    studentsStatusMap[s.student_id] = s.status || studentsStatusMap[s.student_id];
                }
            });

            const container = document.getElementById("studentsList");
            container.innerHTML = "";

            if (allStudents.length === 0) {
                container.innerHTML = "<p>No hay estudiantes a bordo</p>";
                document.getElementById("startBtn").disabled = true;
                document.getElementById("stopBtn").disabled = true;
                return;
            }

            let allDroppedOff = true;

            allStudents.forEach(student => {
                const div = document.createElement("div");
                const status = studentsStatusMap[student.student_id];

                if (status === "dropped_off") {
                    div.innerHTML = `<button style="background-color: green; color: white;" disabled>
                                        ✅ ${student.name} ya se bajó del bus
                                     </button>`;
                } else {
                    div.innerHTML = `<button onclick="alightStudent('${student.student_id}')">
                                        ⬇️ ${student.name} - Bajar
                                     </button>`;
                    allDroppedOff = false;
                }

                container.appendChild(div);
            });

            // Botones de control
            const hasOnboard = Object.values(studentsStatusMap).some(s => s === "onboard");
            document.getElementById("startBtn").disabled = !hasOnboard || trackingInterval !== null;
            document.getElementById("stopBtn").disabled = !allDroppedOff;
        }

        // --- Función para bajar estudiante ---
        async function alightStudent(studentId) {
            if (!trackingInterval) {
                alert("El viaje aún no ha comenzado. No se puede bajar al estudiante.");
                return;
            }

            const response = await fetch("/alight_student", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ student_id: studentId })
            });

            const result = await response.json();

            if (result.status === "ok") {
                studentsStatusMap[studentId] = "dropped_off";
            }

            alert(result.message);
            loadStudents();
        }

        // --- Escaneo QR ---
        document.getElementById("scanQRBtn").addEventListener("click", async () => {
            try {
                const text = await navigator.clipboard.readText();
                const studentData = JSON.parse(text);

                const requiredKeys = ["student_id", "name"];
                if (!requiredKeys.every(k => studentData.hasOwnProperty(k))) {
                    throw new Error("Datos incompletos en el clipboard");
                }

                const res = await fetch(backendBoardUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(studentData)
                });
                const data = await res.json();
                if(data.status !== "ok") throw new Error(data.message);

                alert(`${studentData.name} registrado en la buseta.`);
                scannedStudents.push({student_id: studentData.student_id, name: studentData.name});
                loadStudents();

            } catch(err){
                alert("Error al registrar estudiante: " + err.message);
                console.error(err);
            }
        });

        // --- Start Trip ---
        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const res = await fetch(backendStartUrl, { method: "POST" });
                const data = await res.json();
                if (data.status !== "ok") throw new Error(data.message);

                alert("Trip started!");

                document.getElementById("startBtn").disabled = true;
                document.getElementById("scanQRBtn").disabled = true;

                const sendLocation = (pos) => {
                    const locationData = {
                        bus_id: "bus123",
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        timestamp: new Date().toISOString()
                    };
                    fetch(backendLocationUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(locationData)
                    }).then(r => r.json())
                    .then(res => console.log("Server response:", res))
                    .catch(err => console.error("Error sending location:", err));
                };

                navigator.geolocation.getCurrentPosition(sendLocation);
                trackingInterval = setInterval(() => {
                    navigator.geolocation.getCurrentPosition(sendLocation);
                }, 30000);

            } catch(err){
                alert("Error starting trip: " + err.message);
            }
        });

        // --- Stop Trip ---
        document.getElementById("stopBtn").addEventListener("click", async () => {
            try {
                const res = await fetch(backendStopUrl, { method: "POST" });
                const data = await res.json();
                if(data.status !== "ok") throw new Error(data.message);

                alert("Trip stopped!");
                clearInterval(trackingInterval);
                trackingInterval = null;

                // Mantener botones verdes
                loadStudents();

                document.getElementById("startBtn").disabled = false;
                document.getElementById("scanQRBtn").disabled = false;
                document.getElementById("stopBtn").disabled = true;

            } catch(err){
                alert("Error stopping trip: " + err.message);
            }
        });

        // Actualizar lista cada 5s
        setInterval(loadStudents, 5000);
        loadStudents();
    </script>
</body>
</html>
