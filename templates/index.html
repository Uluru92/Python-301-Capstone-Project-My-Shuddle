<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShuddle Tracker</title>
</head>
<body>
    <h1>MyShuddle Tracker</h1>

    <button id="scanQRBtn">Scan Students QR</button>
    <button id="startBtn" disabled>Start Trip</button>
    <button id="stopBtn" disabled>Stop Trip</button>

    <h2>Students on board</h2>
    <div id="studentsList"></div>

    <script>
        const NGROK_URL = "{{ ngrok_url }}";
        const backendStartUrl = `${NGROK_URL}/start_trip`;
        const backendLocationUrl = `${NGROK_URL}/location`;
        const backendStopUrl = `${NGROK_URL}/stop_trip`;
        const backendBoardUrl = `${NGROK_URL}/board_student`;

        let scannedStudents = [];  
        let trackingInterval = null;
        let studentsStatusMap = {}; // save every student state

        // --- Update student list ---
        async function loadStudents() {
            const response = await fetch("/get_boarded_students");
            const studentsFromServer = await response.json();

            // Combinar pre scanned students and those in the server
            const allStudents = [...new Map(
                [...scannedStudents, ...studentsFromServer].map(s => [s.student_id, s])
            ).values()];

            
            allStudents.forEach(s => {
                if (!studentsStatusMap[s.student_id]) {
                    studentsStatusMap[s.student_id] = s.status || "onboard";
                } else {
                    studentsStatusMap[s.student_id] = s.status || studentsStatusMap[s.student_id];
                }
            });

            const container = document.getElementById("studentsList");
            container.innerHTML = "";

            if (allStudents.length === 0) {
                container.innerHTML = "<p>No hay estudiantes a bordo</p>";
                document.getElementById("startBtn").disabled = true;
                document.getElementById("stopBtn").disabled = true;
                return;
            }

            let allDroppedOff = true;

            allStudents.forEach(student => {
                const div = document.createElement("div");
                const status = studentsStatusMap[student.student_id];

                if (status === "dropped_off") {
                    div.innerHTML = `<button style="background-color: green; color: white;" disabled>
                                        ✅ ${student.name} Dropped off already.
                                     </button>`;
                } else {
                    div.innerHTML = `<button onclick="alightStudent('${student.student_id}')">
                                        ⬇️ ${student.name} - Drop
                                     </button>`;
                    allDroppedOff = false;
                }

                container.appendChild(div);
            });

            // Buttoms Start and Stop
            const hasOnboard = Object.values(studentsStatusMap).some(s => s === "onboard");
            document.getElementById("startBtn").disabled = !hasOnboard || trackingInterval !== null;
            document.getElementById("stopBtn").disabled = !allDroppedOff;
        }

        // --- Function to drop students ---
        async function alightStudent(studentId) {
            const button = event.target; // buttom pushed
            button.disabled = true; // disable button while waiting for new student scanned boards
            if (!trackingInterval) {
                alert("The trip hasn't started yet. The student can't be dropped off.");
                button.disabled = false;
                return;
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const timestamp = new Date().toISOString();

                    try {
                        const response = await fetch("/alight_student", {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify({
                                student_id: studentId,
                                lat: lat,
                                lng: lng,
                                timestamp: timestamp
                            })
                        });

                        const result = await response.json();

                        if (result.status === "ok") {
                            studentsStatusMap[studentId] = "dropped_off";
                        }

                        alert(result.message);
                        loadStudents();
                    } catch (err) {
                        alert("Error al bajar estudiante: " + err.message);
                    } finally {
                        button.disabled = false; // able buttom
                    }
                });
            } else {
                alert("Geolocalización no soportada en este dispositivo.");
                button.disabled = false;
            }
        }

        // --- Scan QR ---
        document.getElementById("scanQRBtn").addEventListener("click", async (event) => {
            const btn = event.target;
            btn.disabled = true; // disable buttom while getting a response to avoid stacking errors
            try {
                const text = await navigator.clipboard.readText();
                const studentData = JSON.parse(text);

                const requiredKeys = ["student_id", "name"];
                if (!requiredKeys.every(k => studentData.hasOwnProperty(k))) {
                    throw new Error("Missing data from clipboard");
                }

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        const locationData = {
                            student_id: studentData.student_id,
                            name: studentData.name,
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            timestamp: new Date().toISOString()
                        };

                        const res = await fetch(backendBoardUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(locationData)
                        });

                        const data = await res.json();

                        if (data.status === "ok") {
                            alert(`${studentData.name} registrado en la buseta.`);
                            // Solo si es nuevo lo añadimos
                            if (!scannedStudents.some(s => s.student_id === studentData.student_id)) {
                                scannedStudents.push({
                                    student_id: studentData.student_id,
                                    name: studentData.name
                                });
                            }
                        } else if (data.status === "warning") {
                            alert(data.message); // aquí recibes "ya está escaneado"
                        } else {
                            throw new Error(data.message);
                        }

                        loadStudents();

                        btn.disabled = false; // volver a habilitar
                    }, (err) => {
                        alert("Error al obtener ubicación: " + err.message);
                        btn.disabled = false;
                    });
                } else {
                    alert("Geolocalización no soportada en este dispositivo.");
                    btn.disabled = false;
                }

            } catch(err){
                alert("Error al registrar estudiante: " + err.message);
                console.error(err);
                btn.disabled = false;
            }
        });

        // --- Start Trip ---
        document.getElementById("startBtn").addEventListener("click", async () => {
            try {
                const res = await fetch(backendStartUrl, { method: "POST" });
                const data = await res.json();
                if (data.status !== "ok") throw new Error(data.message);

                alert("Trip started!");

                document.getElementById("startBtn").disabled = true;
                document.getElementById("scanQRBtn").disabled = true;

                const sendLocation = (pos) => {
                    const locationData = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        timestamp: new Date().toISOString()
                    };
                    fetch(backendLocationUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(locationData)
                    }).then(r => r.json())
                    .then(res => console.log("Server response:", res))
                    .catch(err => console.error("Error sending location:", err));
                };

                navigator.geolocation.getCurrentPosition(sendLocation);
                trackingInterval = setInterval(() => {
                    navigator.geolocation.getCurrentPosition(sendLocation);
                }, 30000);

            } catch(err){
                alert("Error starting trip: " + err.message);
            }
        });

        // --- Stop Trip ---
        document.getElementById("stopBtn").addEventListener("click", async () => {
            try {
                const res = await fetch(backendStopUrl, { method: "POST" });
                const data = await res.json();
                if(data.status !== "ok") throw new Error(data.message);

                alert("Trip stopped!");
                clearInterval(trackingInterval);
                trackingInterval = null;

                // Mantener botones verdes
                loadStudents();

                document.getElementById("startBtn").disabled = false;
                document.getElementById("scanQRBtn").disabled = false;
                document.getElementById("stopBtn").disabled = true;

            } catch(err){
                alert("Error stopping trip: " + err.message);
            }
        });

        // Actualizar lista cada 5s
        setInterval(loadStudents, 5000);
        loadStudents();
    </script>
</body>
</html>
